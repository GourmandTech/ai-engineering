<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="750" fill="#f9f9f7"/>

  <!-- Title -->
  <text x="55" y="55" font-size="30" font-weight="700" fill="#0b0b0b">Production IaC Foundation</text>
  <text x="55" y="82" font-size="16" fill="#52514e">infra/bicep/ — modular, subscription-scoped, least-privilege by design</text>

  <!-- Resource Group outer boundary -->
  <rect x="45" y="115" width="1110" height="590" rx="14" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="65" y="142" font-size="15" fill="#52514e" font-weight="600">Resource Group — rg-contextforge-dev</text>

  <!-- VNet -->
  <rect x="80" y="165" width="480" height="500" rx="12" fill="none" stroke="#52514e" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="100" y="192" font-size="14" fill="#52514e" font-weight="600">VNet — 10.0.0.0/16</text>

  <!-- AKS Subnet -->
  <rect x="105" y="215" width="430" height="420" rx="10" fill="none" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 4"/>
  <text x="122" y="238" font-size="13" fill="#898781">AKS Subnet — 10.0.0.0/22</text>

  <!-- AKS Cluster box -->
  <rect x="130" y="260" width="380" height="340" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="320" y="296" font-size="19" font-weight="700" fill="#0b0b0b" text-anchor="middle">AKS Cluster</text>
  <line x1="150" y1="312" x2="490" y2="312" stroke="#e1e0d9" stroke-width="1"/>
  <text x="320" y="342" font-size="14" fill="#0b0b0b" text-anchor="middle">System node pool</text>
  <text x="320" y="362" font-size="13" fill="#52514e" text-anchor="middle">autoscaling, min 2 / max 10</text>
  <text x="320" y="398" font-size="14" fill="#0b0b0b" text-anchor="middle">OIDC issuer +</text>
  <text x="320" y="418" font-size="14" fill="#0b0b0b" text-anchor="middle">workload identity</text>
  <text x="320" y="454" font-size="14" fill="#0b0b0b" text-anchor="middle">CSI secrets add-on</text>
  <text x="320" y="490" font-size="14" fill="#0b0b0b" text-anchor="middle">Container Insights</text>
  <text x="320" y="558" font-size="12.5" fill="#898781" text-anchor="middle">per-workload managed identities —</text>
  <text x="320" y="576" font-size="12.5" fill="#898781" text-anchor="middle">scoped roles, not broad Owner/Contributor</text>

  <!-- ACR -->
  <rect x="620" y="180" width="480" height="120" rx="12" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2"/>
  <text x="645" y="215" font-size="17" font-weight="700" fill="#0b0b0b">ACR — Standard</text>
  <text x="645" y="238" font-size="13" fill="#52514e">Admin access disabled</text>
  <text x="645" y="258" font-size="13" fill="#52514e">Pull via managed identity only</text>

  <!-- Key Vault -->
  <rect x="620" y="340" width="480" height="120" rx="12" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2"/>
  <text x="645" y="375" font-size="17" font-weight="700" fill="#0b0b0b">Key Vault — Standard</text>
  <text x="645" y="398" font-size="13" fill="#52514e">RBAC authorization mode</text>
  <text x="645" y="418" font-size="13" fill="#52514e">7-day soft-delete, CSI-synced to pods</text>

  <!-- Log Analytics -->
  <rect x="620" y="500" width="480" height="120" rx="12" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2"/>
  <text x="645" y="535" font-size="17" font-weight="700" fill="#0b0b0b">Log Analytics Workspace</text>
  <text x="645" y="558" font-size="13" fill="#52514e">PerGB2018, 30-day retention</text>
  <text x="645" y="578" font-size="13" fill="#52514e">Container Insights sink</text>

  <!-- Arrows: AKS -> ACR / KV / LAW, each labeled with the exact scoped role -->
  <g stroke="#2a78d6" stroke-width="1.75" fill="none">
    <path d="M 510 300 C 570 260, 570 240, 615 235"/>
    <polygon points="615,235 604,232 606,242" fill="#2a78d6"/>
    <path d="M 510 420 C 570 400, 570 400, 615 400"/>
    <polygon points="615,400 604,395 605,405" fill="#2a78d6"/>
    <path d="M 510 480 C 570 520, 570 540, 615 560"/>
    <polygon points="615,560 605,554 604,564" fill="#2a78d6"/>
  </g>
  <text x="522" y="248" font-size="12" fill="#2a78d6" font-weight="600">AcrPull</text>
  <text x="500" y="394" font-size="12" fill="#2a78d6" font-weight="600">KV Secrets User</text>
  <text x="465" y="500" font-size="12" fill="#2a78d6" font-weight="600">Monitoring agent</text>

  <!-- Footer -->
  <text x="55" y="722" font-size="14" fill="#898781">github.com/GourmandTech/ai-engineering</text>
  <text x="1145" y="722" font-size="14" fill="#898781" text-anchor="end">infra/bicep/main.bicep — one module per resource type</text>
</svg>
