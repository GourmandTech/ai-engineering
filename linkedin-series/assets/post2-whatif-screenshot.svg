<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="800" fill="#f9f9f7"/>

  <!-- Title -->
  <text x="55" y="45" font-size="22" font-weight="700" fill="#0b0b0b">A Real what-if Run — Captured Live</text>
  <text x="55" y="68" font-size="13.5" fill="#52514e">Run 2026-07-28, cluster in Stopped state (post-aks-stop) — subscription/tenant IDs redacted</text>

  <!-- Terminal window -->
  <rect x="55" y="90" width="1090" height="660" rx="10" fill="#1a1a19"/>
  <circle cx="80" cy="112" r="6" fill="#e34948"/>
  <circle cx="100" cy="112" r="6" fill="#eda100"/>
  <circle cx="120" cy="112" r="6" fill="#1baf7a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#c3c2b7">
    <text x="80" y="150" fill="#ffffff">$ az deployment sub what-if --location eastus \</text>
    <text x="98" y="170" fill="#ffffff">--parameters infra/bicep/main.bicepparam</text>

    <text x="80" y="204">Resource and property changes are indicated with these symbols:</text>
    <text x="80" y="224" fill="#e34948">  - Delete</text>
    <text x="80" y="242" fill="#1baf7a">  + Create</text>
    <text x="80" y="260" fill="#eda100">  ~ Modify</text>
    <text x="80" y="278" fill="#898781">  = Nochange</text>

    <text x="80" y="312" fill="#ffffff">Scope: /subscriptions/&lt;redacted&gt;/resourceGroups/rg-contextforge-dev</text>

    <text x="80" y="346" fill="#eda100">  ~ Microsoft.ContainerService/managedClusters/aks-contextforge-dev [2024-01-01]</text>
    <text x="98" y="366" fill="#eda100">~ properties.agentPoolProfiles: [</text>
    <text x="116" y="386" fill="#eda100">~ 0:</text>
    <text x="134" y="406" fill="#e34948">- powerState:</text>
    <text x="152" y="426" fill="#e34948">code: "Stopped"</text>
    <text x="116" y="446" fill="#898781">]</text>

    <text x="80" y="480" fill="#898781">  = Microsoft.Network/virtualNetworks/vnet-contextforge-dev [2023-05-01]</text>
    <text x="80" y="500" fill="#898781">  = Microsoft.ManagedIdentity/userAssignedIdentities/id-cost-mcp-server [2023-01-31]</text>
    <text x="80" y="520" fill="#898781">  = Microsoft.ManagedIdentity/userAssignedIdentities/id-sre-agent [2023-01-31]</text>
    <text x="80" y="540" fill="#898781">  = Microsoft.ManagedIdentity/userAssignedIdentities/id-dev-agent [2023-01-31]</text>
    <text x="80" y="560" fill="#898781">  = Microsoft.OperationalInsights/workspaces/log-contextforge-dev [2022-10-01]</text>

    <text x="80" y="594" fill="#eda100">  ~ Microsoft.KeyVault/vaults/kv-contextforge-dev [2023-07-01]</text>
    <text x="98" y="614" fill="#1baf7a">+ properties.networkAcls:</text>
    <text x="116" y="634" fill="#1baf7a">bypass: "AzureServices"</text>
    <text x="116" y="654" fill="#1baf7a">defaultAction: "Allow"</text>

    <text x="80" y="700" fill="#ffffff" font-weight="700">Resource changes: 15 to modify, 10 no change, 1 to ignore.</text>
  </g>

  <!-- Footer -->
  <text x="55" y="780" font-size="13.5" fill="#898781">github.com/GourmandTech/ai-engineering</text>
  <text x="1145" y="780" font-size="13.5" fill="#898781" text-anchor="end">az deployment sub what-if — nothing here is ever applied automatically</text>
</svg>
