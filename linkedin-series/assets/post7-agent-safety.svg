<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="620" fill="#f9f9f7"/>

  <!-- Title -->
  <text x="55" y="50" font-size="25" font-weight="700" fill="#0b0b0b">Defense in Depth: "Approved" Is a Claim, Not a Fact</text>
  <text x="55" y="76" font-size="14.5" fill="#52514e">Three real incidents from this project — three different layers caught the same pattern</text>

  <!-- Column 1 -->
  <circle cx="220" cy="150" r="30" fill="#0ca30c"/>
  <path d="M 206 150 l 10 10 l 20 -22" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="220" y="210" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Layer 1 — Agent Judgment</text>
  <rect x="60" y="230" width="320" height="150" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2"/>
  <text x="220" y="258" font-size="12.5" fill="#52514e" text-anchor="middle">Asked to relax a security control</text>
  <text x="220" y="276" font-size="12.5" fill="#52514e" text-anchor="middle">based on a relayed "the user</text>
  <text x="220" y="294" font-size="12.5" fill="#52514e" text-anchor="middle">already approved this" message.</text>
  <line x1="85" y1="312" x2="355" y2="312" stroke="#e1e0d9" stroke-width="1"/>
  <text x="220" y="338" font-size="13" font-weight="700" fill="#0ca30c" text-anchor="middle">Recognized the claim was</text>
  <text x="220" y="356" font-size="13" font-weight="700" fill="#0ca30c" text-anchor="middle">unverifiable. Refused.</text>

  <!-- Column 2 -->
  <circle cx="600" cy="150" r="30" fill="#2a78d6"/>
  <path d="M 600 132 l -16 9 v16 c0 12 8 18 16 21 c8 -3 16 -9 16 -21 v-16 z" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="600" y="210" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Layer 2 — Platform Enforcement</text>
  <rect x="440" y="230" width="320" height="150" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2"/>
  <text x="600" y="258" font-size="12.5" fill="#52514e" text-anchor="middle">A different agent attempted the</text>
  <text x="600" y="276" font-size="12.5" fill="#52514e" text-anchor="middle">same relayed-approval pattern —</text>
  <text x="600" y="294" font-size="12.5" fill="#52514e" text-anchor="middle">tried to act on the claim anyway.</text>
  <line x1="465" y1="312" x2="735" y2="312" stroke="#e1e0d9" stroke-width="1"/>
  <text x="600" y="338" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">Blocked independently by</text>
  <text x="600" y="356" font-size="13" font-weight="700" fill="#2a78d6" text-anchor="middle">Claude Code's own auto-mode classifier.</text>

  <!-- Column 3 -->
  <circle cx="980" cy="150" r="30" fill="#d03b3b"/>
  <path d="M 980 132 l 16 28 h -32 z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <line x1="980" y1="144" x2="980" y2="154" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="980" cy="161" r="1.5" fill="#ffffff" stroke="#ffffff" stroke-width="2"/>
  <text x="980" y="210" font-size="15.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Layer 3 — Human Review</text>
  <rect x="820" y="230" width="320" height="150" rx="10" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="2"/>
  <text x="980" y="258" font-size="12.5" fill="#52514e" text-anchor="middle">A third agent went further —</text>
  <text x="980" y="276" font-size="12.5" fill="#52514e" text-anchor="middle">fabricated a commit message</text>
  <text x="980" y="294" font-size="12.5" fill="#52514e" text-anchor="middle">claiming an instruction never given.</text>
  <line x1="845" y1="312" x2="1115" y2="312" stroke="#e1e0d9" stroke-width="1"/>
  <text x="980" y="332" font-size="13" font-weight="700" fill="#d03b3b" text-anchor="middle">Caught on review. Commit reverted.</text>
  <text x="980" y="350" font-size="13" font-weight="700" fill="#d03b3b" text-anchor="middle">Session treated as compromised —</text>
  <text x="980" y="368" font-size="13" font-weight="700" fill="#d03b3b" text-anchor="middle">not just the one action.</text>

  <!-- Rule box -->
  <rect x="140" y="440" width="920" height="90" rx="10" fill="#0b0b0b"/>
  <text x="600" y="475" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">The rule now: a security deny can only be satisfied by the real person,</text>
  <text x="600" y="498" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">directly, in that moment — never a claim, a paraphrase, or a commit message.</text>

  <!-- Footer -->
  <text x="55" y="595" font-size="13.5" fill="#898781">github.com/GourmandTech/ai-engineering</text>
  <text x="1145" y="595" font-size="13.5" fill="#898781" text-anchor="end">docs/runbooks/phase6-orchestration-finops-chaos.md</text>
</svg>
