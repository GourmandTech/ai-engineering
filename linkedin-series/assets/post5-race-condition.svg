<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="760" fill="#f9f9f7"/>

  <!-- Title -->
  <text x="55" y="50" font-size="27" font-weight="700" fill="#0b0b0b">The Silent-Hallucination Bug</text>
  <text x="55" y="76" font-size="15.5" fill="#52514e">Claude Agent SDK → ContextForge Gateway — a race between query() and the MCP handshake</text>

  <!-- ============ BEFORE ROW ============ -->
  <text x="80" y="140" font-size="18" font-weight="700" fill="#d03b3b">BEFORE — race condition</text>
  <line x1="80" y1="230" x2="1140" y2="230" stroke="#c3c2b7" stroke-width="2"/>
  <polygon points="1140,230 1128,224 1128,236" fill="#c3c2b7"/>

  <!-- connect() -->
  <circle cx="140" cy="230" r="7" fill="#52514e"/>
  <text x="140" y="200" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">connect()</text>

  <!-- query() sent immediately -->
  <circle cx="230" cy="230" r="7" fill="#d03b3b"/>
  <text x="230" y="264" font-size="12.5" fill="#d03b3b" text-anchor="middle" font-weight="600">query() sent</text>
  <text x="230" y="280" font-size="12.5" fill="#d03b3b" text-anchor="middle" font-weight="600">immediately</text>

  <!-- model runs with 0 tools -->
  <circle cx="470" cy="230" r="7" fill="#d03b3b"/>
  <text x="470" y="184" font-size="12.5" fill="#d03b3b" text-anchor="middle" font-weight="600">Model runs —</text>
  <text x="470" y="200" font-size="12.5" fill="#d03b3b" text-anchor="middle" font-weight="600">0 tools available</text>

  <!-- hallucinated output -->
  <circle cx="700" cy="230" r="9" fill="#d03b3b"/>
  <text x="700" y="264" font-size="13.5" fill="#d03b3b" text-anchor="middle" font-weight="700">Hallucinated report</text>
  <text x="700" y="282" font-size="13.5" fill="#d03b3b" text-anchor="middle" font-weight="700">returned — no error raised</text>

  <!-- too late connection -->
  <line x1="960" y1="230" x2="960" y2="200" stroke="#898781" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="960" cy="230" r="6" fill="#c3c2b7"/>
  <text x="960" y="170" font-size="11.5" fill="#898781" text-anchor="middle">MCP connects ~2s later</text>
  <text x="960" y="186" font-size="11.5" fill="#898781" text-anchor="middle">— already too late</text>

  <!-- ============ AFTER ROW ============ -->
  <text x="80" y="410" font-size="18" font-weight="700" fill="#0ca30c">AFTER — fixed</text>

  <!-- wait bar -->
  <rect x="140" y="490" width="410" height="16" rx="8" fill="#cde2fb"/>
  <text x="345" y="483" font-size="12" fill="#184f95" text-anchor="middle" font-weight="600">waiting — polling get_mcp_status()</text>

  <line x1="80" y1="498" x2="1140" y2="498" stroke="#c3c2b7" stroke-width="2"/>
  <polygon points="1140,498 1128,492 1128,504" fill="#c3c2b7"/>

  <!-- connect() -->
  <circle cx="140" cy="498" r="7" fill="#52514e"/>
  <text x="140" y="468" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">connect()</text>

  <!-- connected -->
  <circle cx="550" cy="498" r="7" fill="#0ca30c"/>
  <text x="550" y="468" font-size="12.5" fill="#0ca30c" text-anchor="middle" font-weight="600">status: "connected"</text>

  <!-- query sent -->
  <circle cx="650" cy="498" r="7" fill="#0b0b0b"/>
  <text x="650" y="532" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">query() sent</text>

  <!-- real tool calls -->
  <circle cx="880" cy="498" r="7" fill="#0ca30c"/>
  <text x="880" y="452" font-size="12" fill="#0ca30c" text-anchor="middle" font-weight="600">Real tool calls —</text>
  <text x="880" y="468" font-size="12" fill="#0ca30c" text-anchor="middle" font-weight="600">kubernetes-mcp, prometheus-mcp, sre-toolbox</text>

  <!-- real report -->
  <circle cx="1080" cy="498" r="9" fill="#0ca30c"/>
  <text x="1080" y="532" font-size="13.5" fill="#0ca30c" text-anchor="middle" font-weight="700">Real report</text>
  <text x="1080" y="550" font-size="13.5" fill="#0ca30c" text-anchor="middle" font-weight="700">returned</text>

  <!-- Fix note -->
  <rect x="140" y="600" width="920" height="80" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2"/>
  <text x="600" y="632" font-size="14.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">Fix: _wait_for_mcp_connection() — poll ClaudeSDKClient.get_mcp_status()</text>
  <text x="600" y="655" font-size="13" fill="#52514e" text-anchor="middle">until the gateway reports "connected," before ever calling query()</text>

  <!-- Footer -->
  <text x="55" y="730" font-size="14" fill="#898781">github.com/GourmandTech/ai-engineering</text>
  <text x="1145" y="730" font-size="14" fill="#898781" text-anchor="end">agents/sre-agent/agent.py</text>
</svg>
