<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="820" fill="#f9f9f7"/>

  <!-- Title -->
  <text x="55" y="45" font-size="22" font-weight="700" fill="#0b0b0b">GET /tools — Captured Live</text>
  <text x="55" y="68" font-size="13.5" fill="#52514e">Run 2026-07-28 against the real gateway — 86 tools from these five servers, still exact</text>

  <!-- Terminal window -->
  <rect x="55" y="90" width="1090" height="680" rx="10" fill="#1a1a19"/>
  <circle cx="80" cy="112" r="6" fill="#e34948"/>
  <circle cx="100" cy="112" r="6" fill="#eda100"/>
  <circle cx="120" cy="112" r="6" fill="#1baf7a"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#c3c2b7">
    <text x="80" y="150" fill="#ffffff">$ curl -s "$GATEWAY_URL/tools?limit=0" \</text>
    <text x="98" y="168" fill="#ffffff">-H "Authorization: Bearer $JWT_TOKEN" \</text>
    <text x="98" y="186" fill="#ffffff">| jq '{total: length, names: [.[].name]}'</text>

    <text x="80" y="220" fill="#eda100">{</text>
    <text x="98" y="240" fill="#ffffff">"total": <tspan fill="#3987e5" font-weight="700">90</tspan>,</text>
    <text x="98" y="258" fill="#ffffff">"names": [</text>

    <text x="116" y="280" fill="#898781">// sre-toolbox — 5 (custom Python FastMCP)</text>
    <text x="116" y="298" fill="#1baf7a">"sre-toolbox-sre-healthcheck", "sre-toolbox-sre-k8s-pod-status",</text>
    <text x="116" y="316" fill="#1baf7a">"sre-toolbox-sre-azure-resource", "sre-toolbox-sre-prometheus-query",</text>
    <text x="116" y="334" fill="#1baf7a">"sre-toolbox-sre-incident-summary",</text>

    <text x="116" y="362" fill="#898781">// github-mcp — 22 (official, self-hosted)</text>
    <text x="116" y="380" fill="#1baf7a">"github-mcp-list-pull-requests", "github-mcp-search-code",</text>
    <text x="116" y="398" fill="#1baf7a">"github-mcp-get-file-contents", "github-mcp-list-commits", ...</text>

    <text x="116" y="426" fill="#898781">// azure-devops-mcp — 40 (official)</text>
    <text x="116" y="444" fill="#1baf7a">"azure-devops-mcp-core-list-projects", "azure-devops-mcp-wit-create-work-item",</text>
    <text x="116" y="462" fill="#1baf7a">"azure-devops-mcp-pipelines-run-pipeline", ...</text>

    <text x="116" y="490" fill="#898781">// kubernetes-mcp — 13 (Red Hat/containers, native SSE)</text>
    <text x="116" y="508" fill="#1baf7a">"kubernetes-mcp-pods-list", "kubernetes-mcp-nodes-top", ...</text>

    <text x="116" y="536" fill="#898781">// prometheus-mcp — 6 (community, native SSE)</text>
    <text x="116" y="554" fill="#1baf7a">"prometheus-mcp-execute-query", "prometheus-mcp-get-targets", ...</text>

    <text x="116" y="582" fill="#898781">// + 4 tools added since Phase 4 (Phase 6 work, not this post's subject):</text>
    <text x="116" y="600" fill="#3987e5">"cost-mcp-cost-by-service", "cost-mcp-cost-by-resource", "cost-mcp-cost-trend",</text>
    <text x="116" y="618" fill="#3987e5">"a2a-dev-agent"</text>

    <text x="98" y="646" fill="#ffffff">]</text>
    <text x="80" y="664" fill="#eda100">}</text>

    <text x="80" y="710" fill="#ffffff" font-weight="700">86 tools across the five servers this post covers — exact match, still holding.</text>
    <text x="80" y="732" fill="#898781">(90 total live today; the other 4 are cost-mcp + an A2A agent tool, added later in Phase 6.)</text>
  </g>

  <!-- Footer -->
  <text x="55" y="792" font-size="13.5" fill="#898781">github.com/GourmandTech/ai-engineering</text>
  <text x="1145" y="792" font-size="13.5" fill="#898781" text-anchor="end">GET /tools?limit=0 — ?limit=0 disables default pagination (50)</text>
</svg>
