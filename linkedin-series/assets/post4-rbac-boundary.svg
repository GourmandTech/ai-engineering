<svg width="1200" height="750" viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1200" height="750" fill="#f9f9f7"/>

  <!-- Title -->
  <text x="55" y="55" font-size="28" font-weight="700" fill="#0b0b0b">RBAC: Teams → Virtual Servers → Tools</text>
  <text x="55" y="82" font-size="16" fill="#52514e">Same 86 federated tools — a different access boundary per team</text>

  <!-- Column headers -->
  <text x="170" y="150" font-size="13" fill="#898781" text-anchor="middle" font-weight="600">TEAM</text>
  <text x="560" y="150" font-size="13" fill="#898781" text-anchor="middle" font-weight="600">VIRTUAL SERVER</text>
  <text x="985" y="150" font-size="13" fill="#898781" text-anchor="middle" font-weight="600">TOOL ACCESS</text>

  <!-- sre-team -->
  <rect x="60" y="205" width="220" height="80" rx="10" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2"/>
  <text x="170" y="250" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">sre-team</text>

  <!-- dev-team -->
  <rect x="60" y="450" width="220" height="80" rx="10" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2"/>
  <text x="170" y="495" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">dev-team</text>

  <!-- sre-full server -->
  <rect x="440" y="180" width="260" height="130" rx="10" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.5"/>
  <text x="570" y="215" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">sre-full</text>
  <text x="570" y="245" font-size="22" font-weight="700" fill="#2a78d6" text-anchor="middle">86 tools</text>
  <text x="570" y="268" font-size="12.5" fill="#52514e" text-anchor="middle">all 5 gateways</text>
  <text x="570" y="286" font-size="12.5" fill="#52514e" text-anchor="middle">visibility: team (sre-team)</text>

  <!-- dev-tools server -->
  <rect x="440" y="440" width="260" height="130" rx="10" fill="#fcfcfb" stroke="#898781" stroke-width="2.5"/>
  <text x="570" y="475" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="middle">dev-tools</text>
  <text x="570" y="505" font-size="22" font-weight="700" fill="#52514e" text-anchor="middle">62 tools</text>
  <text x="570" y="528" font-size="12.5" fill="#52514e" text-anchor="middle">GitHub + Azure DevOps only</text>
  <text x="570" y="546" font-size="12.5" fill="#52514e" text-anchor="middle">visibility: team (dev-team)</text>

  <!-- Arrows team -> server -->
  <g stroke="#0b0b0b" stroke-width="2" fill="none">
    <line x1="280" y1="245" x2="435" y2="245"/>
    <polygon points="435,245 424,240 424,250" fill="#0b0b0b"/>
    <line x1="280" y1="490" x2="435" y2="505"/>
    <polygon points="435,505 423,501 425,511" fill="#0b0b0b"/>
  </g>

  <!-- Tool universe (right column) -->
  <rect x="810" y="180" width="340" height="390" rx="12" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="980" y="208" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">86 TOOLS — TOTAL FEDERATED</text>

  <!-- exclusive-to-sre-full region -->
  <rect x="830" y="225" width="300" height="140" rx="8" fill="#f0efec"/>
  <text x="980" y="252" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">24 tools</text>
  <text x="980" y="272" font-size="12" fill="#52514e" text-anchor="middle">SRE Toolbox + Kubernetes</text>
  <text x="980" y="289" font-size="12" fill="#52514e" text-anchor="middle">+ Prometheus</text>
  <text x="980" y="310" font-size="11.5" fill="#2a78d6" font-weight="600" text-anchor="middle">sre-full only</text>

  <!-- shared/subset region reachable by both -->
  <rect x="830" y="385" width="300" height="165" rx="8" fill="#cde2fb"/>
  <text x="980" y="415" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="middle">62 tools</text>
  <text x="980" y="435" font-size="12" fill="#52514e" text-anchor="middle">GitHub + Azure DevOps</text>
  <text x="980" y="458" font-size="11.5" fill="#184f95" font-weight="600" text-anchor="middle">reachable via sre-full (sre-team)</text>
  <text x="980" y="475" font-size="11.5" fill="#184f95" font-weight="600" text-anchor="middle">AND via dev-tools (dev-team)</text>

  <!-- Arrows server -> tool region -->
  <g stroke="#2a78d6" stroke-width="2" fill="none">
    <path d="M 700 245 C 760 245, 780 260, 828 280"/>
    <polygon points="828,280 816,278 820,288" fill="#2a78d6"/>
  </g>
  <g stroke="#898781" stroke-width="2" fill="none">
    <path d="M 700 505 C 760 495, 780 480, 828 465"/>
    <polygon points="828,465 816,462 819,472" fill="#898781"/>
  </g>

  <!-- Footer -->
  <text x="55" y="710" font-size="14" fill="#898781">github.com/GourmandTech/ai-engineering</text>
  <text x="1145" y="710" font-size="14" fill="#898781" text-anchor="end">Access is scoped by team through the virtual server — not by trusting the caller</text>
</svg>
